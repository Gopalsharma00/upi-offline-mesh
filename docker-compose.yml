version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: upi-mesh-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: upimesh
      POSTGRES_PASSWORD: password
      POSTGRES_DB: upimesh
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: upi-mesh-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
