# Server
server.port=${PORT:8080}

# PostgreSQL (Neon in production, local Docker in dev)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/upimesh}
spring.datasource.username=${DATABASE_USERNAME:upimesh}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis (Upstash in production, local Docker in dev)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# Fail fast when Redis is unreachable. The default 60s command timeout ties up a
# Tomcat thread on every dashboard poll while the host is down.
spring.data.redis.timeout=1500ms
spring.data.redis.connect-timeout=1500ms

# Start beans on first use rather than all at once. Cuts cold-start time on
# Render's free tier, which spins the container down after ~15 minutes idle.
spring.main.lazy-initialization=true

# Fingerprint static assets with a content hash so a deploy never leaves a
# browser running last version's mesh.js against this version's API. Thymeleaf's
# @{...} syntax rewrites the URLs; the files themselves can then cache for a year.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Nothing reads these; skipping them saves startup work.
spring.jmx.enabled=false
spring.jpa.open-in-view=false

# Logging
logging.level.com.demo.upimesh=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Idempotency window (how long a packet hash is remembered)
upi.mesh.idempotency-ttl-seconds=86400

# Packet freshness window — anything older than this is rejected as replay
upi.mesh.packet-max-age-seconds=86400
