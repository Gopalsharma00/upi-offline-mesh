<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>upi-offline-mesh</title>
<meta name="description" content="Console for an offline UPI payment mesh: BLE gossip propagation, bridge-node settlement, idempotency and rate limiting.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" th:href="@{/css/mesh.css}" href="/css/mesh.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-online" viewBox="0 0 24 24"><path d="M5 13a7 7 0 0 1 14 0"/><circle cx="12" cy="18" r="1.3"/></symbol>
  <symbol id="i-offline" viewBox="0 0 24 24"><path d="M3 3l18 18M8.6 11.4A7 7 0 0 1 19 13M5 13a7 7 0 0 1 1.2-2.4"/><circle cx="12" cy="18" r="1.3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</defs></svg>

<!-- ── Title bar ─────────────────────────────────────────────────────────── -->
<header class="titlebar">
  <span class="title">upi-offline-mesh</span>
  <nav class="deps" aria-label="Dependency status">
    <span class="dep" id="depRedis" data-state="idle">redis <b class="dep-val">—</b></span>
    <span class="dep" id="depDb"    data-state="idle">postgres <b class="dep-val">—</b></span>
    <span class="dep" id="depMesh"  data-state="idle">mesh <b class="dep-val">—</b></span>
  </nav>
</header>

<div class="app">
  <!-- ── Canvas column ───────────────────────────────────────────────────── -->
  <main class="stage">
    <div class="toolbar" role="toolbar" aria-label="Mesh actions">
      <button class="tb" onclick="sendPacket()">Inject<kbd>i</kbd></button>
      <button class="tb" onclick="gossip()">Gossip<kbd>g</kbd></button>
      <button class="tb" onclick="flushBridges()">Flush<kbd>f</kbd></button>
      <span class="tb-gap"></span>
      <label class="tb-range">
        range
        <input type="range" id="rangeInput" min="50" max="400" value="150"
               aria-label="Bluetooth range in pixels" oninput="updateRange(this.value)">
        <output id="rangeVal">150</output>
      </label>
      <button class="tb tb-warn" onclick="resetMesh()">Reset<kbd>r</kbd></button>
    </div>

    <div class="canvas-wrap">
      <canvas id="meshCanvas" role="img"
              aria-label="Bluetooth mesh topology. Node state is also listed in the Nodes table."></canvas>
    </div>

    <div class="stage-foot">
      <span class="key"><i class="sw sw-on"></i>online</span>
      <span class="key"><i class="sw sw-off"></i>offline</span>
      <span class="key"><i class="sw sw-pkt"></i>packet</span>
      <span class="key"><i class="sw sw-vip"></i>vip</span>
      <span class="foot-note">drag to reposition</span>
    </div>
  </main>

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="side">

    <section class="panel">
      <h2 class="ph">transaction</h2>
      <div class="form">
        <label class="fr"><span>from</span>
          <select id="senderVpa">
            <option value="alice@demo">alice@demo</option>
            <option value="bob@demo">bob@demo</option>
            <option value="carol@demo">carol@demo</option>
            <option value="dave@demo">dave@demo</option>
          </select></label>
        <label class="fr"><span>to</span>
          <select id="receiverVpa">
            <option value="bob@demo">bob@demo</option>
            <option value="alice@demo">alice@demo</option>
            <option value="carol@demo">carol@demo</option>
            <option value="dave@demo">dave@demo</option>
          </select></label>
        <label class="fr"><span>amount</span>
          <input type="number" id="amount" value="50" min="1" inputmode="numeric"></label>
        <label class="fr"><span>pin</span>
          <input type="text" id="pin" value="1234" maxlength="4" inputmode="numeric" autocomplete="off"></label>
      </div>
    </section>

    <section class="panel">
      <h2 class="ph">nodes <span class="ph-n" id="deviceCount"></span></h2>
      <table class="tbl">
        <thead><tr><th>node</th><th class="num">pkts</th><th class="act"></th></tr></thead>
        <tbody id="deviceList"></tbody>
      </table>
      <div class="addrow">
        <input type="text" id="newDeviceId" placeholder="node-name" aria-label="New node name"
               onkeydown="if(event.key==='Enter')addDeviceFromForm()">
        <button class="tb" onclick="addDeviceFromForm()">add</button>
      </div>
    </section>

    <section class="panel panel-log">
      <h2 class="ph">log</h2>
      <div id="activityLog" class="log" role="log" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2 class="ph">accounts</h2>
      <table class="tbl">
        <thead><tr><th>holder</th><th>vpa</th><th class="num">balance</th></tr></thead>
        <tbody id="accountList"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2 class="ph">ledger <span class="ph-n" id="txCount"></span></h2>
      <table class="tbl">
        <thead><tr><th>from</th><th>to</th><th class="num">amt</th></tr></thead>
        <tbody id="txList"></tbody>
      </table>
    </section>

  </aside>
</div>

<!-- ── Status line ───────────────────────────────────────────────────────── -->
<footer class="statusbar">
  <span class="st"><b id="mPackets">0</b> in flight</span>
  <span class="st"><b id="mBridges">0</b> bridges</span>
  <span class="st"><b id="mDedup">0</b> dedup</span>
  <span class="st"><b id="mSettled">0</b> settled</span>
  <span class="st st-right" id="stState">idle</span>
</footer>

<script th:src="@{/js/mesh.js}" src="/js/mesh.js"></script>
</body>
</html>
