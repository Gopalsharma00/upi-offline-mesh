<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UPI Offline Mesh — Console</title>
<meta name="description" content="Live console for an offline UPI payment mesh: BLE gossip propagation, bridge-node settlement, idempotency and rate limiting.">
<meta name="color-scheme" content="dark">

<!-- Linked here rather than @import-ed from mesh.css so the fonts download in
     parallel with the stylesheet instead of queueing behind it. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" th:href="@{/css/mesh.css}" href="/css/mesh.css">
</head>
<body>

<!-- Icon sprite. Referenced by <use> from both the markup and mesh.js, so the
     paths are defined once and every icon inherits currentColor. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-mesh" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M10.4 6.8 6.6 16.2M13.6 6.8l3.8 9.4M7.2 18h9.6"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10.5 13.5M21 3l-6.8 18-3.7-7.5L3 9.8z"/></symbol>
    <symbol id="i-gossip" viewBox="0 0 24 24"><path d="M17 2.5a9.5 9.5 0 0 1 0 19M7 21.5a9.5 9.5 0 0 1 0-19"/><path d="M14 7.5 17 4.5l-3-3M10 16.5l-3 3 3 3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a2 2 0 0 1 2 2v1"/><rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M16.5 13.5h.01"/></symbol>
    <symbol id="i-signal" viewBox="0 0 24 24"><path d="M5 13a7 7 0 0 1 14 0M8.5 15.5a3.5 3.5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M7 9.5l2.5 2.5L7 14.5M12.5 15H17"/></symbol>
    <symbol id="i-ledger" viewBox="0 0 24 24"><path d="M5 3.5h11a2 2 0 0 1 2 2V21H7a2 2 0 0 1-2-2z"/><path d="M5 17h13M9 7.5h5M9 11h5"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M3.5 18a9 9 0 1 1 17 0"/><path d="M12 14.5 16 10"/><circle cx="12" cy="16.5" r="1.2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-online" viewBox="0 0 24 24"><path d="M5 13a7 7 0 0 1 14 0"/><circle cx="12" cy="18" r="1.3"/></symbol>
    <symbol id="i-offline" viewBox="0 0 24 24"><path d="M3 3l18 18M8.6 11.4A7 7 0 0 1 19 13M5 13a7 7 0 0 1 1.2-2.4"/><circle cx="12" cy="18" r="1.3"/></symbol>
  </defs>
</svg>

<!-- ── Top bar ──────────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="brand">
    <svg class="icon" aria-hidden="true"><use href="#i-mesh"/></svg>
    UPI Offline Mesh
    <span class="brand-sub">bluetooth settlement console</span>
  </div>

  <!-- Live dependency state, not decoration. mesh.js drives data-state. -->
  <div class="dep-strip" id="depStrip">
    <div class="dep" id="depRedis" data-state="idle">
      <span class="dep-led"></span><span class="dep-key">redis</span>
      <span class="dep-val" id="depRedisVal">checking</span>
    </div>
    <div class="dep" id="depDb" data-state="idle">
      <span class="dep-led"></span><span class="dep-key">postgres</span>
      <span class="dep-val" id="depDbVal">checking</span>
    </div>
    <div class="dep" id="depMesh" data-state="idle">
      <span class="dep-led"></span><span class="dep-key">nodes</span>
      <span class="dep-val" id="depMeshVal">—</span>
    </div>
  </div>
</header>

<div class="app">
  <!-- ── Canvas ─────────────────────────────────────────────────────────── -->
  <main class="stage">
    <canvas id="meshCanvas" role="img"
            aria-label="Bluetooth mesh topology. Node state is also listed in the Devices panel."></canvas>

    <div class="stage-overlay">
      <div class="legend">
        <span class="legend-item"><span class="legend-key" style="background:#22c55e"></span>online</span>
        <span class="legend-item"><span class="legend-key" style="background:#64748b"></span>offline</span>
        <span class="legend-item"><span class="legend-key" style="background:#3b82f6"></span>packet</span>
        <span class="legend-item"><span class="legend-key" style="background:#f59e0b"></span>vip</span>
      </div>

      <div class="toolbar">
        <button class="btn btn-primary" onclick="sendPacket()">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-send"/></svg>Inject
        </button>
        <button class="btn" onclick="gossip()">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-gossip"/></svg>Gossip
        </button>
        <button class="btn" onclick="flushBridges()">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-upload"/></svg>Flush
        </button>
        <button class="btn btn-danger" onclick="resetMesh()">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-reset"/></svg>Reset
        </button>
      </div>
    </div>

    <p class="hint">Drag a node to reposition it</p>
  </main>

  <!-- ── Sidebar ────────────────────────────────────────────────────────── -->
  <aside class="side">

    <section class="panel">
      <h2 class="panel-head">
        <svg class="icon" aria-hidden="true"><use href="#i-wallet"/></svg>New transaction
      </h2>
      <div class="field-grid">
        <div class="field">
          <label for="senderVpa">From</label>
          <select id="senderVpa">
            <option value="alice@demo">alice@demo</option>
            <option value="bob@demo">bob@demo</option>
            <option value="carol@demo">carol@demo</option>
            <option value="dave@demo">dave@demo</option>
          </select>
        </div>
        <div class="field">
          <label for="receiverVpa">To</label>
          <select id="receiverVpa">
            <option value="bob@demo">bob@demo</option>
            <option value="alice@demo">alice@demo</option>
            <option value="carol@demo">carol@demo</option>
            <option value="dave@demo">dave@demo</option>
          </select>
        </div>
        <div class="field field-mono">
          <label for="amount">Amount ₹</label>
          <input type="number" id="amount" value="50" min="1" inputmode="numeric">
        </div>
        <div class="field field-mono">
          <label for="pin">PIN</label>
          <input type="text" id="pin" value="1234" maxlength="4" inputmode="numeric" autocomplete="off">
        </div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-head">
        <svg class="icon" aria-hidden="true"><use href="#i-signal"/></svg>Bluetooth range
      </h2>
      <div class="range-row">
        <input type="range" id="rangeInput" min="50" max="400" value="150"
               aria-label="Bluetooth range in pixels" oninput="updateRange(this.value)">
        <span class="range-val" id="rangeVal">150px</span>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-head">
        <svg class="icon" aria-hidden="true"><use href="#i-device"/></svg>Devices
        <span class="panel-count" id="deviceCount"></span>
      </h2>
      <div id="deviceList" class="rows"></div>
      <div class="range-row" style="margin-top:8px">
        <input type="text" id="newDeviceId" placeholder="node name"
               aria-label="New device name" style="flex:1;min-width:0;padding:6px 8px;
               font-family:var(--mono);font-size:12px;color:var(--text);background:var(--bg);
               border:1px solid var(--border);border-radius:var(--r2)">
        <button class="btn btn-ghost btn-sm" onclick="addDeviceFromForm()">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-plus"/></svg>Add
        </button>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-head">
        <svg class="icon" aria-hidden="true"><use href="#i-gauge"/></svg>Runtime
      </h2>
      <div class="metrics">
        <div class="metric">
          <div class="metric-k">In flight</div>
          <div class="metric-v" id="mPackets">0</div>
        </div>
        <div class="metric">
          <div class="metric-k">Bridges</div>
          <div class="metric-v" id="mBridges">0</div>
        </div>
        <div class="metric">
          <div class="metric-k">Dedup cache</div>
          <div class="metric-v" id="mDedup">0</div>
        </div>
        <div class="metric">
          <div class="metric-k">Settled</div>
          <div class="metric-v" id="mSettled">0</div>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2 class="panel-head">
        <svg class="icon" aria-hidden="true"><use href="#i-terminal"/></svg>Log
      </h2>
      <div id="activityLog" class="log" role="log" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2 class="panel-head">
        <svg class="icon" aria-hidden="true"><use href="#i-wallet"/></svg>Balances
      </h2>
      <div id="accountList" class="rows"></div>
    </section>

    <section class="panel">
      <h2 class="panel-head">
        <svg class="icon" aria-hidden="true"><use href="#i-ledger"/></svg>Ledger
        <span class="panel-count" id="txCount"></span>
      </h2>
      <div id="txList" class="rows"></div>
    </section>

  </aside>
</div>

<script th:src="@{/js/mesh.js}" src="/js/mesh.js"></script>
</body>
</html>
