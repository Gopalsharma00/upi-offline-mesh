# Tests run against an in-memory H2 database and in-memory stores, so `mvn test`
# needs nothing installed. Redis is left pointing at a port nothing listens on;
# StoreConfig's probe fails and selects the in-memory backends, which is exactly
# the default path production takes when REDIS_HOST is unset.
spring.datasource.url=jdbc:h2:mem:upimesh-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.data.redis.host=127.0.0.1
spring.data.redis.port=1
spring.data.redis.timeout=250ms
spring.data.redis.connect-timeout=250ms

# Beans must exist eagerly here; a test that autowires the worker needs it started.
spring.main.lazy-initialization=false

logging.level.com.demo.upimesh=INFO
logging.level.org.springframework.data.redis=ERROR
logging.level.io.lettuce=ERROR
